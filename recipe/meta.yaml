{% set version = "4.5.3" %}
{% set python_min = "3.10" %}

package:
  name: glances-suite
  version: {{ version }}

source:
  fn: glances-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/g/glances/glances-{{ version }}.tar.gz
  sha256: 6b95dcca4fa74094c2f0b5eca5ae53493b7833f933b1b49f7636fb39a474f71d

build:
  number: 0

outputs:
  - name: glances
    build:
      noarch: python
      script: python -m pip install . -vv --no-deps --no-build-isolation
      entry_points:
        - glances = glances:main
    requirements:
      host:
        - python {{ python_min }}
        - pip
        - setuptools
      run:
        - python >={{ python_min }}
        - psutil >=5.6.7
        - defusedxml
        - packaging
        - jinja2
        - pyinstrument >=5.1.2
        - shtab
    test:
      requires:
        - pip
        - python {{ python_min }}
      imports:
        - glances
      commands:
        - pip check
        - glances --help

  - name: glances-web
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage('glances', exact=True) }}
        - fastapi >=0.82.0
        - python-jose >=3.3.0
        - requests
        - uvicorn
    test:
      requires:
        - python {{ python_min }}
      imports:
        - glances
      commands:
        - python -c "import fastapi; import jose; import uvicorn"

  - name: glances-gpu
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage('glances', exact=True) }}
        - nvidia-ml-py
    test:
      requires:
        - python {{ python_min }}
      imports:
        - glances
      commands:
        - python -c "import pynvml"

about:
  home: https://github.com/nicolargo/glances
  license: LGPL-3.0-or-later
  license_file: COPYING
  summary: A cross-platform curses-based monitoring tool

extra:
  recipe-maintainers:
    - jakirkham
    - ConorForgie
    - gabrielcnr
